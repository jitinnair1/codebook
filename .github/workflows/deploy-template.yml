name: Publish Template Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to template branch
        run: |
          git checkout -B template
          git rm --cached -f site.toml 2>/dev/null || true
          rm -f site.toml
          rm -f README.md
          rm -rf .workspace
          rm -f src/TODO.md
          find . -name ".DS_Store" -type f -delete 2>/dev/null || true
          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: update template branch from main [skip ci]"
          fi
          git push origin template --force-with-lease
